name: Atualizar agenda

# O agendamento grátis do GitHub atrasa e pula execuções (às vezes fica 5 horas sem disparar).
# Por isso cada rodada tem 6 passos em sequência, um por hora (busca jogos, placares e escalações,
# salva no repositório e publica o site), e no fim o último passo já dispara a rodada seguinte:
# a corrente não depende do agendador. O "schedule" abaixo só serve para religar a corrente se ela parar.
# Enquanto espera a hora do passo, manda os avisos de "começa em 1 hora" a cada ~15 minutos.
# O botão "Run workflow" também começa uma rodada de 6 horas.
# Disparos por push (canais da pesquisa noturna, mudanças no robô) fazem um passo só, na hora.

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      avisar_agora:
        description: "Mandar o resumo do dia agora (teste dos avisos)"
        type: boolean
        default: false
  push:
    paths:
      - "dados/verificados.json"
      - "dados/canais.json"
      - "robo/**"
      - "site/**"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  # push faz um passo só, na hora; agendado e "Run workflow" formam uma corrente única
  # (se chegar outro disparo, ele espera, e o GitHub guarda só o mais novo)
  group: agenda-${{ github.event_name == 'push' && 'push' || 'corrente' }}
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        passo: ${{ github.event_name != 'push' && fromJSON('[0,1,2,3,4,5]') || fromJSON('[0]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esperar a hora deste passo (com avisos de início a cada ~15 min)
        if: matrix.passo > 0
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          git config user.name "robo-avisos"
          git config user.email "robo-avisos@users.noreply.github.com"
          [ -n "$FIREBASE_SA" ] && pip install -q firebase-admin
          for k in 1 2 3 4; do
            sleep 800
            git pull -q --rebase origin main || true
            if [ -n "$FIREBASE_SA" ]; then
              python robo/avisos.py --inicio || echo "avisos de início falharam nesta volta"
              git add dados/avisos_inicio.json 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -q -m "Avisos de início $(date -u +%Y-%m-%dT%H:%MZ)"
                for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 7; done
              fi
            fi
          done
      - name: Pegar a versão mais nova do repositório
        if: matrix.passo > 0
        run: git pull -q --rebase origin main
      - name: Rodar o robô
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python robo/atualizar.py ${{ (github.event_name == 'push' || matrix.passo == 0) && '--completo' || '' }}
      - name: Avisos no celular (resumo do dia às 9h)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            pip install -q firebase-admin && python robo/avisos.py ${{ github.event_name == 'workflow_dispatch' && inputs.avisar_agora && matrix.passo == 0 && '--agora' || '' }}
          else
            echo "Sem FIREBASE_SA: avisos desligados"
          fi
      - name: Salvar agenda no repositório
        run: |
          git config user.name "robo-agenda"
          git config user.email "robo-agenda@users.noreply.github.com"
          git add -A dados site
          git diff --cached --quiet || git commit -m "Agenda atualizada $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 10
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ matrix.passo }}
      - name: Esperar o GitHub registrar o pacote do site
        run: sleep 15
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ matrix.passo }}
      - name: Tentar publicar de novo (se a primeira falhou)
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ matrix.passo }}
      - name: Avisar Bing das páginas novas (IndexNow)
        continue-on-error: true
        run: python robo/paginas.py
      - name: Emendar a próxima rodada de 6 horas
        if: always() && matrix.passo == 5 && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run atualizar.yml --ref main
