name: Atualizar agenda

# O agendamento grátis do GitHub atrasa e pula execuções. Por isso, cada disparo
# agendado vira uma "rodada" de 6 horas: 6 passos em sequência, um por hora,
# cada um busca jogos e placares, salva no repositório e publica o site.
# O botão "Run workflow" também começa uma rodada de 6 horas.
# Disparos por push (canais da pesquisa noturna, mudanças no robô) fazem um passo só, na hora.

on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      avisar_agora:
        description: "Mandar o resumo do dia agora (teste dos avisos)"
        type: boolean
        default: false
  push:
    paths:
      - "dados/verificados.json"
      - "dados/canais.json"
      - "robo/**"
      - "site/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agenda-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        passo: ${{ github.event_name != 'push' && fromJSON('[0,1,2,3,4,5]') || fromJSON('[0]') }}
    steps:
      - name: Esperar a hora deste passo
        if: matrix.passo > 0
        run: sleep 3300
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar o robô
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python robo/atualizar.py ${{ (github.event_name == 'push' || matrix.passo == 0) && '--completo' || '' }}
      - name: Avisos no celular (resumo do dia às 9h)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            pip install -q firebase-admin && python robo/avisos.py ${{ github.event_name == 'workflow_dispatch' && inputs.avisar_agora && matrix.passo == 0 && '--agora' || '' }}
          else
            echo "Sem FIREBASE_SA: avisos desligados"
          fi
      - name: Salvar agenda no repositório
        run: |
          git config user.name "robo-agenda"
          git config user.email "robo-agenda@users.noreply.github.com"
          git add -A dados site
          git diff --cached --quiet || git commit -m "Agenda atualizada $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 10
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ matrix.passo }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ matrix.passo }}
      - name: Avisar Bing das páginas novas (IndexNow)
        continue-on-error: true
        run: python robo/paginas.py
