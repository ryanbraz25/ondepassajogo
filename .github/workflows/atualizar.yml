name: Atualizar agenda

on:
  schedule:
    - cron: "0 */3 * * *"   # a cada 3 horas (horário UTC)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  push:
    paths:
      - "dados/verificados.json"
      - "robo/**"
      - "site/template.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar o robô
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python robo/atualizar.py
      - name: Salvar agenda no repositório
        run: |
          git config user.name "robo-agenda"
          git config user.email "robo-agenda@users.noreply.github.com"
          git add dados/jogos.json site/index.html
          git diff --cached --quiet || git commit -m "Agenda atualizada $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
